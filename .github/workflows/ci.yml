name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: python -m pip install -e .

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run extension API tests
        run: node --test tests/extension_api.test.js
