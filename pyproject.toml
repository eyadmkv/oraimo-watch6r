[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oraimo-watch6r"
version = "0.1.0"
description = "Read-only Python BLE SDK for the Oraimo Watch 6R using MOYOUNG-V2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["bleak>=0.22"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
